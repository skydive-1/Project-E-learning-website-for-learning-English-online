services:
  # 1. Cơ sở dữ liệu PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: elearning_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: elearning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Tự động nạp cấu trúc database và dữ liệu mẫu đồng bộ từ Production khi DB khởi chạy lần đầu
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/seed_prod_data.sql:/docker-entrypoint-initdb.d/02_seed.sql

  # 2. Backend (Node.js/Express)
  backend:
    build:
      context: ./backend
    container_name: elearning_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # GEMINI_API_KEY và PINECONE_API_KEY được nạp nguyên vẹn từ backend/.env ở trên.
      # Không khai báo lại secrets bằng ${VAR} tại đây: Compose nội suy từ shell/root .env
      # trước khi đọc env_file và có thể ghi đè secret hợp lệ thành chuỗi rỗng.
      - PORT=5000
      - NODE_ENV=development
      # Xóa DATABASE_URL để ép backend dùng cấu hình DB_HOST cục bộ không có SSL
      - DATABASE_URL=
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_NAME=elearning_db
      - DB_SSL=false
      - ENABLE_MEDIA_CLEANUP_WORKER=${ENABLE_MEDIA_CLEANUP_WORKER:-true}
      - ENABLE_DRM_PACKAGING=${ENABLE_DRM_PACKAGING:-true}
      - MEDIA_CLEANUP_INTERVAL_MS=${MEDIA_CLEANUP_INTERVAL_MS:-300000}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key-change-this}
      - SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS:-quocanh26012004@gmail.com}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}
      - PINECONE_ENV=${PINECONE_ENV:-us-east-1-aws}
      - PINECONE_INDEX=${PINECONE_INDEX:-elearning-rag}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.7-flash}
      - GEMINI_SPEAKING_MODEL=${GEMINI_SPEAKING_MODEL:-gemini-3.7-flash}
      - FRONTEND_URL=http://localhost:3001
    depends_on:
      - db
    volumes:
      - ./backend:/usr/src/app
      # Tránh mount đè node_modules từ máy thật vào container
      - /usr/src/app/node_modules
      - /usr/src/app/uploads
      # Tùy chọn mount Google Cloud Service Account Key nếu chạy Docker local (được gitignore an toàn):
      # - ./backend/gcp-key.json:/usr/src/app/gcp-key.json:ro

  # 3. Frontend (React/Vite)
  frontend:
    build:
      context: ./frontend
    container_name: elearning_frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgres_data:
